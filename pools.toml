# Loaded by the `registry` crate (see engine/crates/registry/src/lib.rs).
# See .claude/skills/defi-engine/SKILL.md for the decisions behind this list:
# start small, hub tokens as the default criterion, grow toward ~100 later.
#
# `id` is assigned by hand and must stay stable once given out — the hot path
# (and anything that logs against a pool) refers to pools by id, not address.
# Never reuse an id after removing a pool.
